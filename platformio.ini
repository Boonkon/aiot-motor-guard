; ไฟล์นี้ทำให้เปิดโฟลเดอร์ aiot-motor-guard ทั้งก้อนใน VS Code แล้วกด Build/Upload ได้ทันที
; เลือก env ที่แถบล่างของ VS Code:  cucumber = ขั้นที่ 2 (ส่ง MQTT)   sensor_test = ขั้นที่ 1
; (จะเปิดเฉพาะโฟลเดอร์ devices/0x_... ก็ได้เหมือนเดิม)
[platformio]
src_dir = devices
default_envs = cucumber

[env]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200

[env:cucumber]
build_src_filter = +<02_mqtt_features/src/>
build_flags = -I devices/02_mqtt_features/include
lib_deps =
	adafruit/Adafruit HTS221@^0.1.5
	adafruit/Adafruit MPU6050@^2.2.6
	adafruit/Adafruit Unified Sensor@^1.1.14
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.2

[env:sensor_test]
build_src_filter = +<01_sensor_test/src/>
lib_deps =
	adafruit/Adafruit HTS221@^0.1.5
	adafruit/Adafruit MPU6050@^2.2.6
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit Unified Sensor@^1.1.14
